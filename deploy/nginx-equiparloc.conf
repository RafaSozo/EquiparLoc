# nginx na frente do site: recebe o visitante (porta 80/443) e repassa para o Node (porta 3000).
# Copiar para /etc/nginx/sites-available/equiparloc e ativar (ver LOCAWEB-VPS.md).
# O certificado HTTPS é colocado depois pelo certbot, que edita este arquivo sozinho.

server {
    listen 80;
    listen [::]:80;
    server_name equiparloc.com.br www.equiparloc.com.br;

    # Fotos do painel podem ter até 12 MB
    client_max_body_size 15m;

    # Arquivos do site com nome que muda a cada versão: cache longo
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP real do visitante (o site usa no limite de envios: TRUSTED_IP_HEADER=x-real-ip)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
